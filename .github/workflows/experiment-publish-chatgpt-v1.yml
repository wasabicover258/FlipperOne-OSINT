name: Publish ChatGPT Test 1.0 AppImage
on:
  push:
    branches:
      - experiment/flipper-fusion-isolated-20261109
    paths:
      - .github/workflows/experiment-publish-chatgpt-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ARM64 dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev file
          curl -fsSL -o /tmp/appimagetool-aarch64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x /tmp/appimagetool-aarch64.AppImage
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ChatGPT FUSION 1.0
        env:
          APPIMAGETOOL: /tmp/appimagetool-aarch64.AppImage
          BUILD_STAMP: '1.0'
        run: |
          set -euo pipefail
          bash IntegrationTests/FlipperFusion-Independent-20261109/build_arm64.sh
          test -f IntegrationTests/FlipperFusion-Independent-20261109/artifacts/FlipperOne-OSINT-LAB-FUSION-1.0-aarch64.AppImage
      - name: Write only one new file in main/ChatGPT Test
        run: |
          set -euo pipefail
          SOURCE="IntegrationTests/FlipperFusion-Independent-20261109/artifacts/FlipperOne-OSINT-LAB-FUSION-1.0-aarch64.AppImage"
          sha256sum "$SOURCE"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/publish-main" origin/main
          cd "$RUNNER_TEMP/publish-main"
          DEST="ChatGPT Test/ChatGPT-Test-1.0-aarch64.AppImage"
          if test -e "$DEST"; then
            echo "ERROR: refusing to overwrite existing file: $DEST" >&2
            exit 1
          fi
          mkdir -p "ChatGPT Test"
          cp "$GITHUB_WORKSPACE/$SOURCE" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST"
          git commit -m "Add ChatGPT Test ARM64 AppImage 1.0"
          git push origin HEAD:main
          sha256sum "$DEST"
