name: Sync AppImage to Flipper Emulator

on:
  push:
    branches: [main]
    paths:
      - 'Public Releases/**'
  workflow_dispatch:

env:
  SOURCE_DIR: "Public Releases"
  TARGET_REPO: wasabicover258/Flipper-Emulator
  TARGET_DIR: AppCatalogue
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OSINT repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Neueste AppImage finden
        id: find
        run: |
          set -euo pipefail
          FILE=$(find "$SOURCE_DIR" -maxdepth 1 -type f -iname '*.AppImage' | sort -V | tail -n 1)
          if [ -z "$FILE" ]; then
            echo "Keine AppImage in '$SOURCE_DIR' gefunden." >&2
            exit 1
          fi
          echo "Gefunden: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Checkout Flipper-Emulator repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.EMULATOR_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          path: emulator
          lfs: true

      - name: Alte AppImage ersetzen
        env:
          FILE: ${{ steps.find.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p "emulator/$TARGET_DIR"
          rm -f emulator/"$TARGET_DIR"/*.AppImage
          cp "$FILE" "emulator/$TARGET_DIR/"
          chmod +x emulator/"$TARGET_DIR"/*.AppImage

      - name: Commit und Push
        working-directory: emulator
        env:
          FILE: ${{ steps.find.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "Keine Änderung, nichts zu pushen."
            exit 0
          fi
          git commit -m "AppCatalogue: update to $(basename "$FILE")"
          git push origin "$TARGET_BRANCH"
