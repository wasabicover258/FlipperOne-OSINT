name: Sync AppImage to Flipper Emulator
# Copies the AppImage of a public GitHub Release into the emulator's
# AppCatalogue. Called by the build after a release, or by hand (latest
# public release when no tag is given).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = latest public release)'
        required: false

permissions:
  contents: read

env:
  TARGET_REPO: wasabicover258/Flipper-Emulator
  TARGET_DIR: AppCatalogue/OSINT
  TARGET_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-aarch64.AppImage'
          FILE=$(ls *.AppImage | head -n1)
          echo "Release $TAG -> $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Checkout Flipper-Emulator repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.EMULATOR_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          path: emulator
          lfs: true

      - name: Replace old AppImage
        env:
          FILE: ${{ steps.dl.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p "emulator/$TARGET_DIR"
          rm -f emulator/"$TARGET_DIR"/FlipperOne-OSINT-*.AppImage
          cp "dl/$FILE" "emulator/$TARGET_DIR/"
          chmod +x emulator/"$TARGET_DIR"/*.AppImage

      - name: Commit and push
        working-directory: emulator
        env:
          FILE: ${{ steps.dl.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No change, nothing to push."
            exit 0
          fi
          git commit -m "AppCatalogue: update to $FILE"
          git push origin "$TARGET_BRANCH"
