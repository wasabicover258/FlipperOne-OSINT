name: Build AppImage (DevBuilds)

on:
  push:
    branches: [main]
    paths:
      - 'app-ordner/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  APPDIR: app-ordner/app/FlipperOneOSINT.AppDir
  ARCH: aarch64
  OUT_DIR: DevBuilds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version und Dateiname bestimmen
        id: ver
        run: |
          VER=$(grep -m1 '^VERSION' "$APPDIR/usr/share/osint/app.py" | cut -d'"' -f2)
          OUT="$OUT_DIR/FlipperOne-OSINT-${VER}-${ARCH}.AppImage"
          echo "Version: $VER -> $OUT"
          if [ -e "$OUT" ]; then
            echo "FEHLER: $OUT existiert schon. Bitte VERSION in app.py erhöhen." >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: appimagetool holen
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: AppImage für ARM64 bauen
        env:
          OUT: ${{ steps.ver.outputs.out }}
        run: |
          chmod +x "$APPDIR/AppRun"
          mkdir -p "$OUT_DIR"
          ./appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" "$OUT"

      - name: Architektur prüfen
        env:
          OUT: ${{ steps.ver.outputs.out }}
        run: |
          readelf -h "$OUT" | grep -E 'Machine|Class'
          readelf -h "$OUT" | grep -q 'AArch64' || { echo "FEHLER: Datei ist nicht ARM64" >&2; exit 1; }

      - name: Commit nach DevBuilds
        env:
          VER: ${{ steps.ver.outputs.version }}
          OUT: ${{ steps.ver.outputs.out }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "DevBuild AppImage ${VER} (${ARCH})"
          git push origin main
