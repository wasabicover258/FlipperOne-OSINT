name: Build AppImage
# Reproducible builds: every AppImage maps to exactly one commit.
#
#   push / pull request   -> test + build, AppImage kept as workflow artifact
#   tag vX.Y.Z            -> GitHub Release (public)  + sync to Flipper Emulator
#   tag vX.Y.Z-dev.N      -> GitHub Pre-release (DevBuild)
#
# Tags must match app-ordner/VERSION (without the -dev suffix). Releases are
# never overwritten: an existing tag fails the build.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app-ordner/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app-ordner/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  APPDIR: app-ordner/app/FlipperOneOSINT.AppDir
  ARCH: aarch64

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      prerelease: ${{ steps.ver.outputs.prerelease }}
      file: ${{ steps.ver.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          VER=$(tr -d ' \r\n' < app-ordner/VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            BASE="${TAG%%-*}"
            if [ "$BASE" != "$VER" ]; then
              echo "ERROR: tag v$TAG does not match app-ordner/VERSION $VER" >&2
              exit 1
            fi
            VER="$TAG"
            [[ "$TAG" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            VER="${VER}+${GITHUB_SHA::7}"
          fi
          FILE="FlipperOne-OSINT-${VER}-${ARCH}.AppImage"
          echo "Version: $VER -> $FILE"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test backend (recorded fixtures, no live services)
        working-directory: app-ordner/src/cli
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build backend (Go, static)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$APPDIR/usr/bin"
          cd app-ordner/src/cli
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=${VER}" -o "$GITHUB_WORKSPACE/$APPDIR/usr/bin/osint-cli" .

      - name: Build UI (C, SDL2)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev
          gcc -std=gnu99 -O2 -Wall -DAPP_VERSION="\"${VER}\"" app-ordner/src/ui/osint-ui.c \
            -o "$APPDIR/usr/bin/osint-ui" $(sdl2-config --cflags --libs)
          strip "$APPDIR/usr/bin/osint-ui"

      - name: Check binaries
        run: |
          for f in osint-ui osint-cli; do
            readelf -h "$APPDIR/usr/bin/$f" | grep -q AArch64 || { echo "ERROR: $f is not ARM64" >&2; exit 1; }
          done
          readelf -d "$APPDIR/usr/bin/osint-ui" | grep NEEDED
          MAXG=$(objdump -T "$APPDIR/usr/bin/osint-ui" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Highest GLIBC version: $MAXG"
          [ "$(printf '%s\nGLIBC_2.34\n' "$MAXG" | sort -V | tail -n1)" = "GLIBC_2.34" ] || { echo "ERROR: GLIBC > 2.34" >&2; exit 1; }
          ls -l "$APPDIR/usr/bin/"
          "$APPDIR/usr/bin/osint-cli" version
          "$APPDIR/usr/bin/osint-cli" phone "0171 1234567"
          "$APPDIR/usr/bin/osint-cli" modules

      - name: Smoke test against live services (informational)
        continue-on-error: true
        run: |
          "$APPDIR/usr/bin/osint-cli" deep github.com --deadline 90 --exclude lookalike | tee smoke.txt
          grep -q "^# Hostnames" smoke.txt

      - name: Fetch appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        env:
          FILE: ${{ steps.ver.outputs.file }}
        run: |
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/"*
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" "$FILE"
          readelf -h "$FILE" | grep -q 'AArch64' || { echo "ERROR: file is not ARM64" >&2; exit 1; }
          sha256sum "$FILE" | tee "$FILE.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.file }}
          path: |
            ${{ steps.ver.outputs.file }}
            ${{ steps.ver.outputs.file }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.ver.outputs.file }}
          PRE: ${{ steps.ver.outputs.prerelease }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          FLAGS=(--title "FlipperOne-OSINT ${TAG#v}" --notes "Built from ${GITHUB_SHA} by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}. See DevBuilds/VERSIONS.md.")
          [ "$PRE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$TAG" "$FILE" "$FILE.sha256" --verify-tag "${FLAGS[@]}"

  sync:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.prerelease == 'false'
    uses: ./.github/workflows/sync-appcatalogue.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
