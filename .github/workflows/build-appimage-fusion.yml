name: Build AppImage (fusion branch)

# Separate workflow for the fusion branch. It does NOT touch the workflow that builds from
# main, never pushes to main, and never replaces an existing AppImage: the file name carries
# app-ordner/VERSION and the job fails if that file already exists.
#
# New version = change app-ordner/VERSION and push.

on:
  push:
    branches:
      - 'fusion/**'
    paths:
      - 'app-ordner/**'
      - 'PersonIntel/**'
      - '.github/workflows/build-appimage-fusion.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APPDIR: app-ordner/app/FlipperOneOSINT.AppDir
  ARCH: aarch64
  OUT_DIR: DevBuilds

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and file name
        id: ver
        run: |
          VER=$(tr -d ' \r\n' < app-ordner/VERSION)
          OUT="$OUT_DIR/FlipperOne-OSINT-${VER}-${ARCH}.AppImage"
          echo "Version: $VER -> $OUT"
          if [ -e "$OUT" ]; then
            echo "ERROR: $OUT already exists. Please increase app-ordner/VERSION." >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------------------------------------------------------------- tests
      - name: Backend tests (Go)
        run: cd app-ordner/src/cli && go vet ./... && go test ./...

      - name: PersonIntel tests (Python)
        run: |
          # Qt needs these even with the offscreen platform; without them the UI tests
          # would silently skip instead of running.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
          python -m pip install -q --upgrade pip
          python -m pip install -q './PersonIntel[dev]'
          cd PersonIntel
          QT_QPA_PLATFORM=offscreen python -m pytest -q
          # The UI tests must not be skipped here: that would hide regressions.
          QT_QPA_PLATFORM=offscreen python -m pytest tests/test_ui.py -q | tee /tmp/ui.txt
          grep -q 'passed' /tmp/ui.txt && ! grep -q 'skipped' /tmp/ui.txt

      # ------------------------------------------------------------- building
      - name: Build backend (Go, static)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p "$APPDIR/usr/bin"
          cd app-ordner/src/cli
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=${VER}" \
            -o "$GITHUB_WORKSPACE/$APPDIR/usr/bin/osint-cli" .

      - name: Build UI (C, SDL2)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev
          gcc -std=gnu99 -O2 -Wall -Wextra -DAPP_VERSION="\"${VER}\"" app-ordner/src/ui/osint-ui.c \
            -o "$APPDIR/usr/bin/osint-ui" $(sdl2-config --cflags --libs)
          "$APPDIR/usr/bin/osint-ui" --selftest
          strip "$APPDIR/usr/bin/osint-ui"

      # PersonIntel travels with the bundle as plain Python files. Only pure-Python packages go
      # in, so the bundle works with whatever Python 3.10+ the device happens to have and never
      # carries a binary built for the wrong interpreter.
      #
      # Left out on purpose:
      #   'cryptography'  - needs cffi, which has no interpreter-independent wheel. The device
      #                     therefore has no at-rest encryption and no encrypted credential
      #                     store; vendor keys are passed as PERSONINTEL_<MODULE>_<FIELD>.
      #   'phonenumbers'  - 24 MB of country metadata for a check PersonIntel already treats as
      #                     optional; the regular E.164 validation stays in place.
      # Both are covered by tests (see PersonIntel/tests/test_credentials.py).
      - name: Bundle PersonIntel
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          # DIAGNOSE: eine Version mit "nolib" im Namen laesst das Python-Paket weg. Damit
          # laesst sich pruefen, ob usr/lib/personintel der Grund ist, warum flipctl AppRun
          # bei Fusionsbundles nicht ausfuehrt.
          case "$VER" in
            *nolib*)
              echo "DIAGNOSE: PersonIntel wird nicht mitgeliefert ($VER)"
              rm -rf "$APPDIR/usr/lib"
              exit 0
              ;;
          esac
          LIB="$APPDIR/usr/lib/personintel"
          rm -rf "$LIB"
          mkdir -p "$LIB"
          cp -r PersonIntel/src/personintel "$LIB/"
          find "$LIB" -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          find "$LIB" -name '*.dist-info' -prune -exec rm -rf {} + 2>/dev/null || true
          echo "Bundled Python packages:"
          ls -1 "$LIB"
          # No native code at all: nothing that could be built for the wrong interpreter or arch.
          BAD=$(find "$LIB" -name '*.so' -o -name '*.pyd' | head -20)
          if [ -n "$BAD" ]; then
            echo "ERROR: the bundle must stay pure Python, found:" >&2
            echo "$BAD" >&2
            exit 1
          fi
          du -sh "$LIB"

      - name: Check binaries
        run: |
          for f in osint-ui osint-cli; do
            readelf -h "$APPDIR/usr/bin/$f" | grep -q AArch64 || { echo "ERROR: $f is not ARM64" >&2; exit 1; }
          done
          echo "Libraries needed by the UI:"
          readelf -d "$APPDIR/usr/bin/osint-ui" | grep NEEDED
          MAXG=$(objdump -T "$APPDIR/usr/bin/osint-ui" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Highest GLIBC version: $MAXG"
          [ "$(printf '%s\nGLIBC_2.34\n' "$MAXG" | sort -V | tail -n1)" = "GLIBC_2.34" ] || { echo "ERROR: GLIBC > 2.34" >&2; exit 1; }
          # The five original modules must still work exactly as before.
          "$APPDIR/usr/bin/osint-cli" version
          "$APPDIR/usr/bin/osint-cli" phone "0171 1234567"
          # The person modules must report honestly, with or without a usable Python.
          APPDIR="$PWD/$APPDIR" "$APPDIR/usr/bin/osint-cli" pi-status x | head -20

      - name: Build AppImage
        env:
          OUT: ${{ steps.ver.outputs.out }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool
          # DIAGNOSE 1.4.6-diag: die bekannt lauffaehige Oberflaeche aus dem 1.3.0-Bundle
          # mitnehmen. Kein Neubau - genau das Binary, das im Emulator nachweislich startet.
          ./DevBuilds/FlipperOne-OSINT-1.3.0-aarch64.AppImage --appimage-extract >/dev/null
          cp squashfs-root/usr/bin/osint-ui "$APPDIR/usr/bin/osint-ui-130"
          rm -rf squashfs-root
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/"*
          # The shelf shows app.toml's name. Keep it in step with VERSION, otherwise two
          # different builds appear under the same name and cannot be told apart.
          sed -i "s/@VERSION@/${VER}/" "$APPDIR/app.toml"
          if grep -q "@VERSION@" "$APPDIR/app.toml"; then
            echo "ERROR: placeholder left in app.toml" >&2; exit 1
          fi
          grep '^name' "$APPDIR/app.toml"
          mkdir -p "$OUT_DIR"
          ARCH=aarch64 ./appimagetool --appimage-extract-and-run --no-appstream "$APPDIR" "$OUT"
          readelf -h "$OUT" | grep -q 'AArch64' || { echo "ERROR: file is not ARM64" >&2; exit 1; }
          ls -l "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          # app.toml carries a placeholder in the repository; the substitution above is only
          # for this build. Restore it, otherwise the commit step finds a dirty tree.
          git checkout -- "$APPDIR/app.toml"

      - name: Smoke test the finished bundle
        env:
          OUT: ${{ steps.ver.outputs.out }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          ./"$OUT" --appimage-extract >/dev/null
          case "$VER" in
            *nolib*)
              echo "DIAGNOSE-Build ohne PersonIntel: nur Bundle-Struktur wird geprueft."
              test -f squashfs-root/app.toml
              grep -q '^wayland' squashfs-root/app.toml
              test -x squashfs-root/usr/bin/osint-ui
              test ! -d squashfs-root/usr/lib
              exit 0
              ;;
          esac
          test -f squashfs-root/app.toml
          grep -q '^wayland' squashfs-root/app.toml
          grep -q "^name = \"OSINT ${VER}\"" squashfs-root/app.toml

          # The device has no installed PersonIntel: strip it from PATH so the bundled copy is
          # the only one that can answer. Without this the test would silently pass against the
          # pip install from the test step and prove nothing about the bundle.
          BIN=$(mktemp -d)
          ln -s /usr/bin/python3 "$BIN/python3"
          # A stand-in for sherlock that writes the documented CSV, so an active check is
          # actually available and the confirmation rule can be exercised.
          cat > "$BIN/sherlock" <<'SH'
          #!/usr/bin/env python3
          import csv, sys
          a = sys.argv[1:]
          if "--version" in a: print("sherlock 0.16.0"); sys.exit(0)
          if "--help" in a: print("usage: sherlock [--csv] [--print-found] [--no-color] [--timeout TIMEOUT]"); sys.exit(0)
          u = a[0]
          with open(f"{u}.csv", "w", newline="") as fh:
              w = csv.writer(fh)
              w.writerow(["username","name","url_main","url_user","exists","http_status","response_time_s"])
              w.writerow([u,"GitHub","https://github.com",f"https://github.com/{u}","Claimed",200,0.2])
          SH
          sed -i 's/^          //' "$BIN/sherlock"
          chmod +x "$BIN/sherlock"
          export PATH="$BIN:/usr/bin:/bin"
          export APPDIR="$PWD/squashfs-root"
          export PERSONINTEL_DATA_DIR=$(mktemp -d)
          unset PERSONINTEL_CMD || true
          CLI=squashfs-root/usr/bin/osint-cli
          command -v personintel-cli && { echo "ERROR: an installed PersonIntel would mask the bundle" >&2; exit 1; } || true

          # The device situation: the bundle is pure Python, so 'cryptography' and
          # 'phonenumbers' are NOT there. The runner's system Python has them (the test step
          # installed them), so they are hidden behind stubs - otherwise this step would test
          # a setup the device never has.
          STUB=$(mktemp -d)
          for m in cryptography phonenumbers; do
            mkdir -p "$STUB/$m"
            echo "raise ImportError('not available on the device')" > "$STUB/$m/__init__.py"
          done
          export PYTHONPATH="$STUB"

          echo "--- module status from the bundle (device situation: no cryptography)"
          $CLI pi-status x > /tmp/pi.txt; head -8 /tmp/pi.txt
          grep -q 'bundled PersonIntel' /tmp/pi.txt || { echo "ERROR: the bundled copy was not used" >&2; exit 1; }
          grep -q 'of 10 person modules' /tmp/pi.txt || { echo "ERROR: module status missing" >&2; exit 1; }
          grep -q 'No encrypted credential store' /tmp/pi.txt \
            || { echo "ERROR: without cryptography the app must say the credential store is unavailable" >&2; exit 1; }
          grep -q 'PERSONINTEL_PIPL_API_KEY' /tmp/pi.txt \
            || { echo "ERROR: the environment-variable route for keys is not named" >&2; exit 1; }
          # Every module that is not ready has to name its prerequisite - nothing is simulated.
          test "$(grep -c 'needs:' /tmp/pi.txt)" -ge 8 \
            || { echo "ERROR: modules without a prerequisite line" >&2; exit 1; }

          echo "--- a query without a documented purpose must be blocked"
          $CLI person-username testuser confirm > /tmp/a.txt; head -3 /tmp/a.txt
          grep -q 'No valid research purpose' /tmp/a.txt || { echo "ERROR: query ran without a purpose" >&2; exit 1; }

          echo "--- documenting a purpose"
          $CLI pi-case "Verifikation einer Quelle fuer einen Artikel ueber Foerdermittel" > /tmp/b.txt; head -3 /tmp/b.txt
          grep -q 'Purpose documented' /tmp/b.txt || { echo "ERROR: purpose was not accepted" >&2; exit 1; }

          echo "--- an active check without confirmation must be refused"
          $CLI person-username testuser > /tmp/c.txt; head -4 /tmp/c.txt
          grep -qi 'est.*tigung erforderlich' /tmp/c.txt || { echo "ERROR: active check ran unconfirmed" >&2; exit 1; }
          grep -q 'No module could run this query' /tmp/c.txt || { echo "ERROR: something ran anyway" >&2; exit 1; }

          echo "--- with confirmation it runs and the finding carries source and evidence level"
          $CLI person-username testuser confirm > /tmp/d.txt; head -12 /tmp/d.txt
          grep -q 'module(s) ran: sherlock' /tmp/d.txt || { echo "ERROR: the confirmed query did not run" >&2; exit 1; }
          grep -q '^~ ' /tmp/d.txt || { echo "ERROR: no finding with an evidence level" >&2; exit 1; }
          grep -q 'sherlock 0.16.0' /tmp/d.txt || { echo "ERROR: the source does not name the tool version" >&2; exit 1; }
          grep -q '^= ' /tmp/d.txt && { echo "ERROR: a module reported 'proven' - only a human review may" >&2; exit 1; } || true

          echo "--- the infrastructure modules are untouched"
          $CLI phone "0171 1234567" | grep -q '+491711234567' || { echo "ERROR: phone module changed" >&2; exit 1; }
          # A device without any python3: no bundle path, no interpreter. The person modules
          # must then name the prerequisite, and the infrastructure modules must still work.
          ( unset APPDIR; PATH=/nonexistent $CLI pi-status x > /tmp/nobridge.txt ) || true
          grep -q 'not available' /tmp/nobridge.txt \
            || { echo "ERROR: a missing bridge was not reported" >&2; exit 1; }
          grep -q 'keep working without it' /tmp/nobridge.txt \
            || { echo "ERROR: missing note that the other modules still work" >&2; exit 1; }
          grep -q 'no python3 was found' /tmp/nobridge.txt \
            || { echo "ERROR: the missing interpreter is not named" >&2; exit 1; }
          PATH=/nonexistent $CLI phone "0171 1234567" | grep -q 'Germany' \
            || { echo "ERROR: a missing interpreter blocked an infrastructure module" >&2; exit 1; }

          echo "--- desktop situation: with cryptography the store is locked until unlocked"
          unset PYTHONPATH
          PERSONINTEL_DATA_DIR=$(mktemp -d) $CLI pi-status x > /tmp/pi2.txt; head -6 /tmp/pi2.txt
          grep -q 'of 10 person modules' /tmp/pi2.txt || { echo "ERROR: module status missing" >&2; exit 1; }
          grep -q 'Credential store locked' /tmp/pi2.txt \
            || { echo "ERROR: with cryptography present the store must be reported as locked" >&2; exit 1; }
          export PYTHONPATH="$STUB"

          echo "--- no process is left behind"
          sleep 1
          ! pgrep -f 'personintel.cli' || { echo "ERROR: a bridge process stayed alive" >&2; exit 1; }

          echo "--- the UI starts and its state machine is intact"
          SDL_VIDEODRIVER=dummy timeout 5 squashfs-root/usr/bin/osint-ui squashfs-root/usr/bin/osint-cli || true
          squashfs-root/usr/bin/osint-ui --selftest

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipperOne-OSINT-${{ steps.ver.outputs.version }}-aarch64
          path: |
            ${{ steps.ver.outputs.out }}
            ${{ steps.ver.outputs.out }}.sha256
          if-no-files-found: error

      # Commits to THIS branch only. main is never touched.
      - name: Commit to DevBuilds on this branch
        if: github.event_name != 'pull_request'
        env:
          VER: ${{ steps.ver.outputs.version }}
          OUT: ${{ steps.ver.outputs.out }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "Refusing to commit to main from the fusion workflow." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT" "$OUT.sha256"
          git commit -m "DevBuild AppImage ${VER} (${ARCH}, fusion)"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
