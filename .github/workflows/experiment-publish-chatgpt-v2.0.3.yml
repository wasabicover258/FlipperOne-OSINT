name: Publish ChatGPT Test 2.0.3 AppImage
# Versioned build: publish only as a NEW file, never overwrite prior AppImages.
on:
  push:
    branches:
      - experiment/chatgpt-v2.0.3-list-buttons
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ARM64 dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev file
          curl -fsSL -o /tmp/appimagetool-aarch64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x /tmp/appimagetool-aarch64.AppImage
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Build ChatGPT FUSION 2.0.3 and run UI/Go checks
        env:
          APPIMAGETOOL: /tmp/appimagetool-aarch64.AppImage
          BUILD_STAMP: '2.0.3'
        run: |
          set -euo pipefail
          ( cd app-ordner/src/cli && go mod tidy )
          bash IntegrationTests/FlipperFusion-Independent-20261109/build_arm64.sh
          test -f IntegrationTests/FlipperFusion-Independent-20261109/artifacts/FlipperOne-OSINT-LAB-FUSION-2.0.3-aarch64.AppImage
      - name: Check actual SDL2 button borders and 255-background screenshots
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/osint-palette"
          gcc -std=gnu99 -O2 -Wall app-ordner/src/ui/osint-ui.c -o "$RUNNER_TEMP/osint-ui-palette" $(sdl2-config --cflags --libs)
          SDL_VIDEODRIVER=dummy "$RUNNER_TEMP/osint-ui-palette" --screenshot "$RUNNER_TEMP/osint-palette"
          python3 IntegrationTests/FlipperFusion-Independent-20261109/verify_display_palette.py "$RUNNER_TEMP/osint-palette"
      - name: Upload rendered display evidence
        uses: actions/upload-artifact@v4
        with:
          name: flipper-osint-2.0.3-grayscale-screens
          path: ${{ runner.temp }}/osint-palette/*.bmp
          retention-days: 30
      - name: Publish version 2.0.3 alongside 1.0 on main
        run: |
          set -euo pipefail
          SOURCE="IntegrationTests/FlipperFusion-Independent-20261109/artifacts/FlipperOne-OSINT-LAB-FUSION-2.0.3-aarch64.AppImage"
          sha256sum "$SOURCE"
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/publish-main" origin/main
          cd "$RUNNER_TEMP/publish-main"
          DEST="ChatGPT Test/ChatGPT-Test-2.0.3-aarch64.AppImage"
          if test -e "$DEST"; then
            echo "ERROR: refusing to overwrite existing file: $DEST" >&2
            exit 1
          fi
          mkdir -p "ChatGPT Test"
          cp "$GITHUB_WORKSPACE/$SOURCE" "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DEST"
          git commit -m "Add ChatGPT Test ARM64 AppImage 2.0.3"
          git push origin HEAD:main
          sha256sum "$DEST"
